name: Embed Madinah Mushaf in App.jsx

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/embed-mushaf.yml"
      - "public/mushaf/pages/**"
      - "src/App.jsx"

permissions:
  contents: write

jobs:
  embed:
    if: "!contains(github.event.head_commit.message, '[skip mushaf embed]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed all 604 Mushaf pages
        shell: python
        run: |
          import base64
          import gzip
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(".")
          app_path = root / "src" / "App.jsx"
          pages_dir = root / "public" / "mushaf" / "pages"

          pages = {}
          for path in sorted(pages_dir.glob("[0-9][0-9][0-9].json")):
              key = path.stem
              pages[key] = json.loads(path.read_text(encoding="utf-8"))

          if len(pages) != 604 or set(pages) != {f"{i:03d}" for i in range(1, 605)}:
              raise SystemExit(f"Expected exactly 604 pages, found {len(pages)}")

          payload = json.dumps(pages, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          compressed = base64.b64encode(gzip.compress(payload, compresslevel=9)).decode("ascii")

          app = app_path.read_text(encoding="utf-8")

          marker = "const QCF_TOTAL_PAGES = 604;"
          if marker not in app:
              raise SystemExit("QCF_TOTAL_PAGES marker not found")

          start_marker = "const MADINAH_MUSHAF_PAGES_GZIP_BASE64 = ";
          start = app.find(start_marker)
          if start != -1:
              end = app.find(";", start)
              if end == -1:
                  raise SystemExit("Existing embedded Mushaf constant is malformed")
              app = app[:start] + app[end + 1:].lstrip("\n")

          helper = """const MADINAH_MUSHAF_PAGES_GZIP_BASE64 = "__PAYLOAD__";
let madinahMushafPagesPromise = null;

async function getBundledMadinahMushafPages() {
  if (!madinahMushafPagesPromise) {
    madinahMushafPagesPromise = (async () => {
      const binary = Uint8Array.from(atob(MADINAH_MUSHAF_PAGES_GZIP_BASE64), (char) => char.charCodeAt(0));
      const decompressor = new DecompressionStream("gzip");
      const stream = new Blob([binary]).stream().pipeThrough(decompressor);
      const text = await new Response(stream).text();
      return JSON.parse(text);
    })();
  }
  return madinahMushafPagesPromise;
}
""".replace("__PAYLOAD__", compressed)

          app = app.replace(marker, marker + "\n\n" + helper, 1)

          pattern = re.compile(
              r"async function fetchMushafPageQCF\(pageNum\) \{.*?\n\}",
              re.S,
          )
          replacement = """async function fetchMushafPageQCF(pageNum) {
  const key = String(pageNum).padStart(3, "0");
  if (mushafPageDataCache.has(key)) {
    return mushafPageDataCache.get(key);
  }

  const pages = await getBundledMadinahMushafPages();
  const data = pages[key];
  if (!data) {
    throw new Error("صفحة المصحف غير موجودة");
  }

  mushafPageDataCache.set(key, data);
  return data;
}"""
          app2, count = pattern.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit("fetchMushafPageQCF function was not found exactly once")

          app_path.write_text(app2, encoding="utf-8", newline="\n")

          # Syntax/build check before committing.
          subprocess.run(["npm", "ci", "--ignore-scripts"], check=True)
          subprocess.run(["npm", "run", "build"], check=True)

      - name: Commit embedded Mushaf
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Embed all 604 Madinah Mushaf pages in App.jsx [skip mushaf embed]"
          git push
